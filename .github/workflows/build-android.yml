name: Build OpenDisplay Enhanced Android
'on':
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/build-android.yml
      - scripts/patch_android.py
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: josepacelli/opendisplay-android
          ref: v0.0.37
          path: android
      - name: Apply Enhanced audio changes
        run: cd android && python3 ../scripts/patch_android.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Enhanced-Android-Audio-v5
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
