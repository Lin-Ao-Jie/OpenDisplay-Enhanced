name: Build OpenDisplay PiP Fix Android
'on':
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/build-android.yml
      - scripts/apply_pipfix_only.py
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: josepacelli/opendisplay-android
          ref: v0.0.37
          path: android
      - name: Apply PiP background fix only
        run: cd android && python3 ../scripts/apply_pipfix_only.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew clean assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Android-0.0.37-PiPFix
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
