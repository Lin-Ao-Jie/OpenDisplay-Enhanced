name: Build OpenDisplay Enhanced macOS
'on':
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/build-mac.yml
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: peetzweg/opendisplay
          ref: v1.19.0
      - name: Apply Enhanced v4 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Mac/InputInjector.swift'); s=p.read_text()
          marker='    /// dx/dy in display pixels, natural-scrolling sign from the phone.'
          add='''    func handleText(_ text: String) {
              guard !text.isEmpty, let down = CGEvent(keyboardEventSource: source, virtualKey: 0, keyDown: true), let up = CGEvent(keyboardEventSource: source, virtualKey: 0, keyDown: false) else { return }
              let units = Array(text.utf16)
              units.withUnsafeBufferPointer { buf in down.keyboardSetUnicodeString(stringLength: units.count, unicodeString: buf.baseAddress!); up.keyboardSetUnicodeString(stringLength: units.count, unicodeString: buf.baseAddress!) }
              down.post(tap: .cghidEventTap); up.post(tap: .cghidEventTap)
          }
          func handleKey(_ key: String) {
              let code: CGKeyCode
              switch key { case "backspace": code=51; case "enter": code=36; case "tab": code=48; case "escape": code=53; case "left": code=123; case "right": code=124; case "down": code=125; case "up": code=126; default: return }
              CGEvent(keyboardEventSource: source, virtualKey: code, keyDown: true)?.post(tap: .cghidEventTap); CGEvent(keyboardEventSource: source, virtualKey: code, keyDown: false)?.post(tap: .cghidEventTap)
          }

'''
          assert marker in s; p.write_text(s.replace(marker,add+marker,1))
          p=Path('Mac/MacSender.swift'); s=p.read_text(); marker='        case "pencil":'
          add='''        case "text":
              if let text = obj["text"] as? String { inputInjector?.handleText(text) }
          case "key":
              if let key = obj["key"] as? String { inputInjector?.handleKey(key) }
          case "resolution":
              if mode == .extend, let width = obj["width"] as? Int, let height = obj["height"] as? Int, width >= 640, height >= 480, var info = lastHello {
                  info.pixelsWide = width * 2; info.pixelsHigh = height * 2; lastHello = info
                  Task { await self.reconfigure(info) }
              }
'''
          assert marker in s; p.write_text(s.replace(marker,add+marker,1))
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./generate.sh
      - name: Build Release
        run: xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecarMac -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Sign and package
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier io.github.linaojie.OpenDisplayEnhanced' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName OpenDisplay Enhanced' "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName OpenDisplay Enhanced' "$APP/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string OpenDisplay Enhanced' "$APP/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mv "$APP" "$(dirname "$APP")/OpenDisplay Enhanced.app"
          ditto -c -k --sequesterRsrc --keepParent 'build/Build/Products/Release/OpenDisplay Enhanced.app' 'OpenDisplay-Enhanced-macOS-v4.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Enhanced-macOS-v4
          path: OpenDisplay-Enhanced-macOS-v4.zip
          if-no-files-found: error
