name: Build OpenDisplay Enhanced macOS
'on':
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/build-mac.yml
      - scripts/patch_mac_v4.py
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peetzweg/opendisplay
          ref: v1.19.0
          path: clean-mac
      - name: Apply audio and retained changes to clean upstream
        run: cd clean-mac && python3 ../scripts/patch_mac_v4.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate clean project
        run: cd clean-mac && ./generate.sh
      - name: Build clean Release
        run: cd clean-mac && xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecarMac -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Sign and package clean app
        run: cd clean-mac && APP=$(find build/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1) && test -n "$APP" && /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier io.github.linaojie.OpenDisplayEnhanced' "$APP/Contents/Info.plist" && codesign --force --deep --sign - --timestamp=none "$APP" && codesign --verify --deep --strict --verbose=2 "$APP" && ditto -c -k --sequesterRsrc --keepParent "$APP" ../OpenDisplay-Enhanced-macOS-Audio-v6-clean.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Enhanced-macOS-Audio-v6-clean
          path: OpenDisplay-Enhanced-macOS-Audio-v6-clean.zip
          if-no-files-found: error
