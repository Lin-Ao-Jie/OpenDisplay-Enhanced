name: Build OpenDisplay Enhanced macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/mac-enhanced.patch'
      - '.github/workflows/build-mac.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peetzweg/opendisplay
          ref: v1.19.0
          path: opendisplay
      - name: Apply validated Enhanced patch
        working-directory: opendisplay
        run: |
          git apply --check ../patches/mac-enhanced.patch
          git apply ../patches/mac-enhanced.patch
      - name: Harden cursor reclaim against hot corners
        working-directory: opendisplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Mac/InputInjector.swift')
          s=p.read_text()
          s=s.replace('guard tablet.width > 0, tablet.height > 0, main.width > 4, main.height > 4 else { return }','guard tablet.width > 0, tablet.height > 0, main.width > 96, main.height > 96 else { return }')
          s=s.replace('let inset: CGFloat = 2','let inset: CGFloat = 4\n        let cornerInset: CGFloat = 48')
          s=s.replace('target.x = min(main.maxX - inset, max(main.minX + inset, target.x))\n        target.y = min(main.maxY - inset, max(main.minY + inset, target.y))','target.x = min(main.maxX - cornerInset, max(main.minX + cornerInset, target.x))\n        target.y = min(main.maxY - cornerInset, max(main.minY + cornerInset, target.y))')
          p.write_text(s)
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: opendisplay
        run: ./generate.sh
      - name: Build Release
        working-directory: opendisplay
        run: xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecarMac -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Set permanent Enhanced identity and sign
        working-directory: opendisplay
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier io.github.linaojie.OpenDisplayEnhanced' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName OpenDisplay Enhanced' "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName OpenDisplay Enhanced' "$APP/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string OpenDisplay Enhanced' "$APP/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          test "$ID" = 'io.github.linaojie.OpenDisplayEnhanced'
          mv "$APP" "$(dirname "$APP")/OpenDisplay Enhanced.app"
      - name: Package
        working-directory: opendisplay
        run: |
          APP='build/Build/Products/Release/OpenDisplay Enhanced.app'
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" '../OpenDisplay-Enhanced-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Enhanced-macOS
          path: OpenDisplay-Enhanced-macOS.zip
          if-no-files-found: error
