name: Build Keyboard v3 No Reclaim
'on':
  push:
    branches: [keyboard-v3-no-reclaim]
    paths: [.github/workflows/build-keyboard-v3.yml, scripts/**]
  workflow_dispatch: {}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: enhancements}
      - uses: actions/checkout@v4
        with:
          repository: josepacelli/opendisplay-android
          ref: v0.0.38
          path: android
      - name: Apply stable PiP reconnect
        run: cd android && python3 ../enhancements/scripts/apply_pipfix_only.py
      - name: Apply working audio
        run: cd android && python3 ../enhancements/scripts/patch_android_audio_v38.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Unit tests before artifact
        run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest --stacktrace
      - name: Verify no cursor reclaim and stable features
        run: |
          ! grep -R 'CursorReclaim\|CGWarpMouse' android/app/src/main || exit 1
          grep -R 'VERSION = 4' android/app/src/main/java
          grep -R 'AudioTrack\|MediaCodec' android/app/src/main/java
          grep -R 'enterPictureInPictureMode' android/app/src/main/java
      - name: Build APK
        run: cd android && ./gradlew clean assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Android-Keyboard-v3
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {path: enhancements}
      - uses: actions/checkout@v4
        with:
          repository: M4st3rZeus/opendisplay
          ref: d000262d29190fcb393665b6bab2a5cdd2bec2e7
          path: mac
      - run: brew install xcodegen
      - run: cd mac && ./generate.sh
      - name: Verify reclaim removed
        run: '! grep -R "CGWarpMouseCursorPosition\|cursorReclaimMonitor\|odCursorMonitor" mac/Mac || exit 1'
      - name: Build Mac
        run: cd mac && xcodebuild -project OpenSidecar.xcodeproj -scheme OpenSidecarMac -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Verify audio and protocol before artifact
        run: |
          grep -R 'capturesAudio' mac/Mac
          grep -R 'AudioEncoder' mac/Mac
          grep -R 'taggedFrameVersion = 4' mac/Shared
      - name: Sign and package
        run: |
          cd mac
          APP=$(find build/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.peetzweg.opensidecar.mac' "$APP/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../OpenDisplay-macOS-Keyboard-v3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-macOS-Keyboard-v3
          path: OpenDisplay-macOS-Keyboard-v3.zip
          if-no-files-found: error
